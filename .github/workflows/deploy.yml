name: Cloudflare production release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for rebuilding the current main branch
        required: false
        type: string
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  scheduled-content:
    name: Check scheduled content
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_SMOKE_URL || 'https://personal-publishing-system.zanezx.workers.dev' }}
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Check the production schedule manifest
        id: check
        run: node scripts/status-due.mjs

  deploy-production:
    name: Deploy production
    needs: scheduled-content
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        ) ||
        (
          github.event_name == 'schedule' &&
          needs.scheduled-content.outputs.due == 'true'
        )
      )
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://zanezx.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
      PUBLIC_INDEXING_ENABLED: ${{ vars.PUBLIC_INDEXING_ENABLED || 'false' }}
      PRODUCTION_SMOKE_URL: ${{ vars.PRODUCTION_SMOKE_URL || 'https://personal-publishing-system.zanezx.workers.dev' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Download the CI-verified production artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-candidate
          path: release-candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Build a verified candidate for a manual or scheduled release
        if: github.event_name != 'workflow_run'
        env:
          PUBLIC_INDEXING_ENABLED: ${{ vars.PUBLIC_INDEXING_ENABLED || 'false' }}
          PUBLIC_PREVIEW_CONTENT: "false"
        run: |
          pnpm install --frozen-lockfile
          pnpm cms:check
          pnpm build
          node scripts/candidate-artifact.mjs create \
            --source dist \
            --destination release-candidate \
            --mode production \
            --commit "$(git rev-parse HEAD)" \
            --indexing "$PUBLIC_INDEXING_ENABLED" \
            --preview-content false
      - name: Verify the production artifact and commit
        env:
          EXPECTED_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          PUBLIC_INDEXING_ENABLED: ${{ vars.PUBLIC_INDEXING_ENABLED || 'false' }}
        run: |
          node scripts/candidate-artifact.mjs verify release-candidate \
            --commit "$EXPECTED_COMMIT" \
            --mode production \
            --indexing "$PUBLIC_INDEXING_ENABLED" \
            --preview-content false
          rm -rf dist
          mv release-candidate/dist dist
      - name: Record the active version for rollback
        id: baseline
        run: |
          version="$(
            pnpm dlx wrangler@4.165.0 versions list \
              --name personal-publishing-system \
              --json |
              jq -r 'sort_by(.metadata.created_on) | last.id // ""'
          )"
          printf 'version_id=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Deploy the production Worker
        id: deploy
        run: pnpm dlx wrangler@4.165.0 deploy --env ""
      - name: Verify the production deployment
        env:
          SMOKE_RETRIES: "30"
        run: pnpm smoke --base-url "$PRODUCTION_SMOKE_URL"
      - name: Roll back a failed production deployment
        if: failure() && steps.deploy.outcome == 'success' && steps.baseline.outputs.version_id != ''
        run: |
          pnpm dlx wrangler@4.165.0 rollback \
            "${{ steps.baseline.outputs.version_id }}" \
            --name personal-publishing-system \
            --yes \
            --message "Automatic rollback after failed smoke test"
