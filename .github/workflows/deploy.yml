name: Cloudflare production release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for rebuilding the current main branch
        required: false
        type: string
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  scheduled-content:
    name: Check scheduled content
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Check the production schedule manifest
        id: check
        run: node scripts/status-due.mjs

  deploy-production:
    name: Deploy production
    needs: scheduled-content
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        ) ||
        (
          github.event_name == 'schedule' &&
          needs.scheduled-content.outputs.due == 'true'
        )
      )
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://zanezx.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
      PUBLIC_INDEXING_ENABLED: ${{ vars.PUBLIC_INDEXING_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cms:check
      - run: pnpm build
      - name: Record the active version for rollback
        id: baseline
        run: |
          version="$(
            pnpm dlx wrangler@4.165.0 versions list \
              --name personal-publishing-system \
              --json |
              jq -r 'sort_by(.metadata.created_on) | last.id // ""'
          )"
          printf 'version_id=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Deploy the production Worker
        run: pnpm dlx wrangler@4.165.0 deploy --env ""
      - name: Verify the production deployment
        env:
          SMOKE_RETRIES: "30"
        run: pnpm smoke --base-url https://zanezx.com
      - name: Roll back a failed production deployment
        if: failure() && steps.baseline.outputs.version_id != ''
        run: |
          pnpm dlx wrangler@4.165.0 rollback \
            "${{ steps.baseline.outputs.version_id }}" \
            --name personal-publishing-system \
            --yes \
            --message "Automatic rollback after failed smoke test"
