name: CMS auto merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: cms-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  queue-safe-content:
    name: Queue content merge
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Detect the CMS publication stage
        id: stage
        run: |
          ready="$(
            gh pr view "$PR_NUMBER" --json labels \
              --jq '[.labels[].name] | index("sveltia-cms/pending_publish") != null'
          )"
          printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
      - name: Validate content-only changes
        if: steps.stage.outputs.ready == 'true'
        run: |
          gh pr view "$PR_NUMBER" --json files --jq '.files[].path' |
            node scripts/validate-content-pr.mjs
      - name: Enable squash auto-merge
        if: steps.stage.outputs.ready == 'true'
        run: |
          gh pr merge "$PR_NUMBER" \
            --auto \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA"
      - name: Deploy after the CMS pull request merges
        if: steps.stage.outputs.ready == 'true'
        run: |
          for attempt in $(seq 1 120); do
            state="$(
              gh pr view "$PR_NUMBER" --json state --jq '.state'
            )"
            if [ "$state" = "MERGED" ]; then
              gh workflow run deploy.yml \
                --ref main \
                --field "reason=CMS publication PR #$PR_NUMBER merged"
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "CMS pull request #$PR_NUMBER closed without merging" >&2
              exit 1
            fi
            sleep 10
          done

          echo "CMS pull request #$PR_NUMBER was not merged within 20 minutes" >&2
          exit 1
      - name: Cancel auto-merge after leaving pending_publish
        if: steps.stage.outputs.ready != 'true'
        run: gh pr merge "$PR_NUMBER" --disable-auto || true
