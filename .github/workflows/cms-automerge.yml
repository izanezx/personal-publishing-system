name: CMS auto merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: cms-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  queue-safe-content:
    name: Queue content merge
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Detect the CMS publication stage
        id: stage
        run: |
          ready="$(
            gh pr view "$PR_NUMBER" --json labels \
              --jq '[.labels[].name] | index("sveltia-cms/pending_publish") != null'
          )"
          printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
      - name: Validate content-only changes
        if: steps.stage.outputs.ready == 'true'
        run: |
          gh pr view "$PR_NUMBER" --json files --jq '.files[].path' |
            node scripts/validate-content-pr.mjs
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        if: steps.stage.outputs.ready == 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.stage.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned dependencies
        if: steps.stage.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Normalize CMS Markdown
        id: format
        if: steps.stage.outputs.ready == 'true'
        run: |
          pnpm format

          if git diff --quiet; then
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unexpected="$(
            git diff --name-only |
              node -e '
                let data = "";
                process.stdin.on("data", chunk => (data += chunk));
                process.stdin.on("end", () => {
                  const files = data.trim().split("\n").filter(Boolean);
                  const outside = files.filter(path => !path.startsWith("src/data/"));
                  if (outside.length) process.stdout.write(outside.join("\n"));
                });
              '
          )"
          if [ -n "$unexpected" ]; then
            printf 'Prettier changed non-content files unexpectedly:\n%s\n' "$unexpected" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data
          git commit -m "chore: normalize CMS content"
          git push origin "HEAD:refs/heads/$HEAD_REF"

          current_sha="$(git rev-parse HEAD)"
          echo "head_sha=$current_sha" >> "$GITHUB_OUTPUT"

          # Pushes authenticated with GITHUB_TOKEN do not start another workflow.
          # Dispatch CI explicitly for the normalized commit before enabling auto-merge.
          gh workflow run ci.yml --ref "$HEAD_REF"
      - name: Enable squash auto-merge
        if: steps.stage.outputs.ready == 'true'
        env:
          MERGE_SHA: ${{ steps.format.outputs.head_sha }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --auto \
            --squash \
            --delete-branch \
            --match-head-commit "$MERGE_SHA"
      - name: Cancel auto-merge after leaving pending_publish
        if: steps.stage.outputs.ready != 'true'
        run: gh pr merge "$PR_NUMBER" --disable-auto || true
